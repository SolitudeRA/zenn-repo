name: Validate Articles for Zenn

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: zenn-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate_pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTICLE_MAP_BASE_REF: ${{ github.event.pull_request.base.sha }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Test identity and generation safety
        run: npm test

      - name: Verify committed generated outputs
        run: npm run check:articles

      - name: Validate Zenn article metadata
        run: npx --no-install zenn list:articles

      - name: Reject whitespace errors in the event range
        run: git diff --check "$ARTICLE_MAP_BASE_REF" HEAD --

  validate_main_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTICLE_MAP_BASE_REF: ${{ github.event.before }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Test identity and generation safety
        run: npm test

      - name: Verify committed generated outputs
        run: npm run check:articles

      - name: Validate Zenn article metadata
        run: npx --no-install zenn list:articles

      - name: Reject whitespace errors in the event range
        run: git diff --check "$ARTICLE_MAP_BASE_REF" HEAD --
